name: InstaCrave CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run unit tests
      working-directory: ./backend
      run: npm run test:unit

    - name: Run integration tests
      working-directory: ./backend
      run: npm run test:integration

    - name: Run full test suite with coverage
      working-directory: ./backend
      run: npm run test:coverage

    # Jest automatically checks coverage thresholds from jest.config.js
    # No need for separate nyc check-coverage command

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage
        fail_ci_if_error: true

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          backend/coverage/
          backend/*.log

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Check for frontend security vulnerabilities
      working-directory: ./frontend
      run: npm audit --audit-level=high || true

  backend-build:
    name: Backend Build Check
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Check for security vulnerabilities
      working-directory: ./backend
      run: npm audit --audit-level=high || true

    - name: Build success
      run: echo "✅ Backend build completed successfully"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, backend-build]
    if: always()

    steps:
    - name: Test Results
      run: |
        echo "Backend Test Status: ${{ needs.backend-test.result }}"
        echo "Frontend Build Status: ${{ needs.frontend-build.result }}"
        echo "Backend Build Status: ${{ needs.backend-build.result }}"
