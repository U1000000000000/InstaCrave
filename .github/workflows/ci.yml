name: InstaCrave Full-Stack CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 1: Backend Tests & Coverage
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  backend-test:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run backend linting
      working-directory: ./backend
      run: npm run lint

    - name: Run unit tests
      working-directory: ./backend
      run: npm run test:unit

    - name: Run integration tests
      working-directory: ./backend
      run: npm run test:integration

    - name: Run full test suite with coverage
      working-directory: ./backend
      run: npm run test:coverage


    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage
        fail_ci_if_error: true

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results-${{ matrix.node-version }}
        path: |
          backend/coverage/
          backend/*.log

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 2: Frontend Build
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend linting
      working-directory: ./frontend
      run: npm run lint
      continue-on-error: true

    - name: Build frontend production bundle
      working-directory: ./frontend
      run: npm run build

    - name: Archive frontend build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 3: Backend Build
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  backend-build:
    name: Backend Build & Docker
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Verify backend server can start
      working-directory: ./backend
      run: |
        timeout 10s node server.js || true
        echo "✅ Backend server validated"

    - name: Build Docker image (test build)
      working-directory: ./backend
      run: |
        if [ -f Dockerfile ]; then
          docker build -t instacrave-backend:test .
          echo "✅ Docker image built successfully"
        else
          echo "⚠️  No Dockerfile found, skipping Docker build"
        fi

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 4: Security Audit
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, backend-build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Check backend security vulnerabilities
      working-directory: ./backend
      run: npm audit --audit-level=high

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Check frontend security vulnerabilities
      working-directory: ./frontend
      run: npm audit --audit-level=high
      continue-on-error: true

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage 5: CI Summary
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  notify:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, backend-build, security-audit]
    if: always()

    steps:
    - name: CI Results Summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "     InstaCrave CI Pipeline      "
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "🧪 Backend Tests:  ${{ needs.backend-test.result }}"
        echo "🎨 Frontend Build: ${{ needs.frontend-build.result }}"
        echo "🏗️  Backend Build:  ${{ needs.backend-build.result }}"
        echo "🔒 Security Audit: ${{ needs.security-audit.result }}"
        echo ""
        
        if [[ "${{ needs.backend-test.result }}" == "success" ]] && \
           [[ "${{ needs.frontend-build.result }}" == "success" ]] && \
           [[ "${{ needs.backend-build.result }}" == "success" ]] && \
           [[ "${{ needs.security-audit.result }}" == "success" ]]; then
          echo "✅ All CI checks passed!"
          exit 0
        else
          echo "❌ Some CI checks failed"
          exit 1
        fi
